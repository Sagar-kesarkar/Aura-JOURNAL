name: Firestore Rules Official Emulator Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate-rules:
    name: Verify Firestore Security Rules with Emulator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Firebase CLI Globally
        run: npm install -g firebase-tools

      - name: Pre-cache Firestore Emulator
        run: firebase setup:emulators:firestore

      - name: Run Real Firestore Emulator Suite
        run: npm run test:rules:emulator

