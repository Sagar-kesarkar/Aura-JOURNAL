steps:
  # 1. Build production container image using root Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/aura-journal:$COMMIT_SHA', '.']

  # 2. Push container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/aura-journal:$COMMIT_SHA']

  # 3. Deploy to Google Cloud Run with mandatory challenge label
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'aura-journal'
      - '--image'
      - 'gcr.io/$PROJECT_ID/aura-journal:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,ALLOWED_ORIGINS=https://aura-journal-$PROJECT_NUMBER.asia-southeast1.run.app,GEMINI_MODEL=gemini-3.8-flash,GEMINI_FALLBACK_MODELS=gemini-3.6-flash,NODE_ENV=production'
      - '--set-secrets'
      - 'GEMINI_API_KEY=GEMINI_API_KEY:latest'
      - '--labels'
      - 'dev-tutorial=cloud-run-ai-challenge'

images:
  - 'gcr.io/$PROJECT_ID/aura-journal:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
